<nav class="navbar navbar-dark bg-navy py-2 shadow-sm">
  <div class="container d-flex align-items-center">
    <button class="btn btn-link text-white p-0 me-3 hamburger-btn" type="button" (click)="toggleMenu()"
      aria-label="Abrir menu" [attr.aria-expanded]="isMenuOpen">
      <i class="bi bi-list fs-2"></i>
    </button>

    <a class="navbar-brand d-flex align-items-center me-auto" routerLink="/home">
      <img src="http://localhost:3001/img/ford.png" alt="Ford Logo" class="ford-logo me-2">
    </a>

    <div class="d-flex align-items-center">
      <span class="text-white-50 me-3 d-none d-sm-inline" *ngIf="currentUser$ | async as user">
        Olá, <strong class="text-white">{{ user.nome }}</strong>
      </span>
      <button (click)="logout()" class="btn btn-outline-light btn-sm px-3 rounded-pill">
        <i class="bi bi-box-arrow-right me-1"></i> Sair
      </button>
    </div>
  </div>

<!-- Overlay escurecido -->
<div class="menu-overlay" [class.show]="isMenuOpen" (click)="closeMenu()"></div>

<!-- Menu lateral -->
<aside class="side-menu" [class.open]="isMenuOpen">
  <div class="side-menu-header d-flex align-items-center justify-content-between px-3 py-3">
    <span class="fw-bold text-uppercase tracking-wider text-white">Menu</span>
    <button class="btn btn-link text-white p-0" (click)="closeMenu()" aria-label="Fechar menu">
      <i class="bi bi-x-lg fs-4"></i>
    </button>
  </div>
  <ul class="nav flex-column px-2 pt-2">
    <li class="nav-item">
      <a class="nav-link side-menu-link" routerLink="/home" routerLinkActive="active" (click)="closeMenu()">
        <i class="bi bi-house-door me-2"></i> Home
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link side-menu-link" routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()">
        <i class="bi bi-speedometer2 me-2"></i> Dashboard
      </a>
    </li>
  </ul>
</aside>
